name: CI

"on":
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    # Conservative matrix, not copied from other repos without checking:
    # basic-pitch pulls in TensorFlow, which has real cross-platform/
    # cross-Python-version rough edges. Starting narrower (no macOS, no
    # 3.13) and widening later once actually confirmed green, rather than
    # guessing a full matrix passes.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -x -q
