[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "songforge-mcp"
version = "0.2.0"
description = "MCP server for local AI music generation via ACE-Step 1.5, with optional vocal/instrumental stem splitting"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "playwright>=1.61.0",
    "yt-dlp>=2026.7.4",
    "soundfile>=0.13.1",
    "librosa>=0.11.0",
    "numpy>=1.26.4",
    "basic-pitch>=0.4.0",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
songforge-mcp = "songforge_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["songforge_mcp", "songforge_mcp_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
