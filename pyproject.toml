[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocal-synth-mcp"
version = "0.1.0"
description = "MCP server for local singing-voice synthesis (melody + lyrics -> vocal stem)"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
# Dependencies intentionally left unpinned — the DiffSinger integration
# and exact package set aren't decided yet. See docs/2026-07-21-design.md
# "Open questions" #4 before filling this in.
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
vocal-synth-mcp = "vocal_synth_mcp.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
