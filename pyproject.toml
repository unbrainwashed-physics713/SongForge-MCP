[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocal-synth-mcp"
version = "0.1.0"
description = "MCP server for local singing-voice synthesis (melody + lyrics -> vocal stem)"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
vocal-synth-mcp = "vocal_synth_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["vocal_synth_mcp", "vocal_synth_mcp_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
